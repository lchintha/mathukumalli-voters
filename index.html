<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <title>Mathukumalli Voters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div>
        <div class="brand-title">Mathukumalli</div>
        <div class="brand-sub">Gram Panchayat Voter List · 2026</div>
      </div>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#dashboard" data-route="dashboard" class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#voters" data-route="voters" class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Voters</span>
      </a>
    </nav>
  </header>

  <main id="app">
    <!-- DASHBOARD -->
    <section id="view-dashboard" class="view" hidden>
      <div class="page-head">
        <h1>Dashboard</h1>
      </div>

      <div class="kpis" id="kpis"></div>

      <article class="card">
        <div class="card-head">
          <h2 class="with-icon" id="party-title"></h2>
          <span class="chip-muted" id="tag-progress"></span>
        </div>
        <div class="stackbar" id="party-stack"></div>
        <div class="party-tiles" id="party-tiles"></div>
      </article>

      <article class="card">
        <div class="card-head">
          <h2 class="with-icon" id="ward-title"></h2>
          <span class="muted small">Tap a ward to see its voters</span>
        </div>
        <div class="wards" id="wards"></div>
      </article>
    </section>

    <!-- VOTERS -->
    <section id="view-voters" class="view" hidden>
      <div class="page-head">
        <h1>Voters</h1>
        <p class="muted" id="result-count"></p>
      </div>

      <div class="filters card">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false"
                 placeholder="గ్రా.పం.ఓ.జా. వ.సం. or Voter ID">
        </div>
        <div class="filter-row">
          <label class="field">
            <span>Ward</span>
            <select id="f-ward"></select>
          </label>
          <label class="field">
            <span>Gender</span>
            <select id="f-gender">
              <option value="">All</option>
              <option value="పు">Male</option>
              <option value="స్త్రీ">Female</option>
            </select>
          </label>
          <label class="field">
            <span>Party</span>
            <select id="f-party"></select>
          </label>
          <label class="field">
            <span>Location</span>
            <select id="f-abroad">
              <option value="">All</option>
              <option value="1">Out of country</option>
              <option value="0">In village</option>
            </select>
          </label>
        </div>
        <div class="active-filters" id="active-filters"></div>
      </div>

      <div class="voter-table-head" aria-hidden="true">
        <span>గ్రా.పం.ఓ.జా. వ.సం.</span>
        <span>Voter</span>
        <span>Ward · House</span>
        <span>Age / Sex</span>
        <span>Party</span>
      </div>
      <div id="voter-list" class="voter-list"></div>
      <div class="list-foot">
        <button class="btn" id="load-more" type="button" hidden>Show more</button>
      </div>
    </section>
  </main>

  <!-- Voter detail sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-name"></aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
